# ===================================================================
# Mosquitto Configuration - Development Mode
# ===================================================================
# This config enables:
# - Plain MQTT on port 1883
# - TLS MQTT on port 8883
# - Dynamic Security Plugin for authentication and ACLs
# - Persistence
# ===================================================================

# ===================================================================
# General Settings
# ===================================================================
listener 1883
protocol mqtt

listener 8883
protocol mqtt

# Allow anonymous for dev (disable in production!)
allow_anonymous true

# ===================================================================
# Persistence
# ===================================================================
persistence true
persistence_location /mosquitto/data/

# Save to disk every 5 seconds if changed
autosave_interval 5
autosave_on_changes false

# ===================================================================
# Logging
# ===================================================================
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Log levels:
# - error: only critical errors
# - warning: warnings
# - notice: normal operation messages
# - information: informational messages
# - all: all messages (very verbose)
# - debug: debug messages
log_type error
log_type warning
log_type notice
log_type information

# ===================================================================
# Connection Limits
# ===================================================================
max_connections -1
max_keepalive 65535

# ===================================================================
# Message Size Limits
# ===================================================================
message_size_limit 0
max_inflight_messages 20
max_queued_messages 1000

# ===================================================================
# Dynamic Security Plugin (v2)
# ===================================================================
plugin /usr/libexec/mosquitto_dynamic_security.so

# Configuration file for Dynamic Security Plugin
# This file is managed by the plugin - do not edit manually
dynamic_security_path /mosquitto/config/dynamic-security.json

# ===================================================================
# WebSockets (optional, for web clients)
# ===================================================================
# listener 8083
# protocol websockets