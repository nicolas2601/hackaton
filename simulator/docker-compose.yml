services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.sim
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      TENANT: trebol
    depends_on:
      mqtt:
        condition: service_healthy
    networks:
      - manufactura

  mqtt:
    image: eclipse-mosquitto:2-alpine
    container_name: manufactura-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - manufactura
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-i", "hc", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  manufactura:
    driver: bridge