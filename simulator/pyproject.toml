[project]
name = "cacaotrace-simulator"
version = "0.1.0"
description = "MQTT simulator for CacaoTrace — cacao telemetry"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
