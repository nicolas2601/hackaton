[project]
name = "manufactura-simulator"
version = "0.1.0"
description = "MQTT Simulator for Manufactura Santander 4.0"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.1.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]