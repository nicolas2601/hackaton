# ===================================================================
# CacaoTrace — Granja Digital Inteligente - Development Docker Compose
# ===================================================================
# Use this for local development. All services are exposed for debugging.
# Run with: docker compose up
# ===================================================================

services:
  # ==========================================================================
  # PostgreSQL 16 - Primary Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cacaotrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cacaotrace_dev
      POSTGRES_USER: cacaotrace
      POSTGRES_PASSWORD: cacaotrace_dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=es_CO"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cacaotrace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cacaotrace -d cacaotrace_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Redis 7 - Channels Layer (optional for dev)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: cacaotrace-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - cacaotrace-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Mosquitto 2.x - MQTT Broker with Dynamic Security
  # ==========================================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cacaotrace-mosquitto
    restart: unless-stopped
    ports:
      - "1884:1883"   # Plain MQTT (localhost only in prod!)
      - "8884:8883"   # TLS MQTT
      - "9002:9001"   # HTTP management API
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - cacaotrace-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================================================
  # Backend - Django Application
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
      target: development
    container_name: cacaotrace-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "8000:8000"
    networks:
      - cacaotrace-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgres://manufactura:cacaotrace_dev_password@postgres:5432/cacaotrace_dev
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production-minimum-50-characters-long
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal
      - MQTT_BROKER_URL=mqtt://manufactura:manufactura123@mosquitto:1883
      - MQTT_BROKER_USERNAME=manufactura
      - MQTT_BROKER_PASSWORD=manufactura123
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - PYTHONUNBUFFERED=1
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ==========================================================================
  # Frontend - React Development Server (Vite)
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.frontend
      target: development
    container_name: cacaotrace-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    networks:
      - cacaotrace-net
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
      - VITE_MCP_URL=http://localhost:8765
      - VITE_CHAT_URL=http://localhost:8766
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # MCP Server - FastMCP Server for AI Integration
  # ==========================================================================
  mcp:
    build:
      context: .
      dockerfile: ./Dockerfile.mcp
      target: development
    container_name: cacaotrace-mcp
    restart: unless-stopped
    volumes:
      - ./mcp-server:/app
    ports:
      - "8765:8765"   # FastMCP streamable-http
      - "8766:8766"   # /chat FastAPI
    networks:
      - cacaotrace-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - MCP_PORT=8765
      - CHAT_PORT=8766
      - API_URL=http://backend:8000
      - MCP_API_TOKEN=${MCP_API_TOKEN:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "mcp_server"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8766/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ==========================================================================
  # MQTT Worker — Django management command that ingests cacao/# into Supabase
  # ==========================================================================
  mqtt-worker:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
      target: development
    container_name: cacaotrace-mqtt-worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
    networks:
      - cacaotrace-net
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=${DATABASE_URL:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production-minimum-50-characters-long}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal,backend
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_BROKER_USERNAME=${MQTT_BROKER_USERNAME:-}
      - MQTT_BROKER_PASSWORD=${MQTT_BROKER_PASSWORD:-}
      - PYTHONUNBUFFERED=1
    command: python manage.py mqtt_ingest
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Simulator — MQTT Data Simulator (always on in dev)
  # ==========================================================================
  simulator:
    build:
      context: .
      dockerfile: ./Dockerfile.sim
      target: development
    container_name: cacaotrace-simulator
    restart: unless-stopped
    networks:
      - cacaotrace-net
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_BROKER_USERNAME=${MQTT_BROKER_USERNAME:-}
      - MQTT_BROKER_PASSWORD=${MQTT_BROKER_PASSWORD:-}
      - SIM_SPEED=${SIM_SPEED:-1}
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ===================================================================
# Networks
# ===================================================================
networks:
  cacaotrace-net:
    driver: bridge

# ===================================================================
# Volumes
# ===================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_static:
    driver: local
  backend_media:
    driver: local