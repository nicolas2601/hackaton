# ===================================================================
# CacaoTrace — Granja Digital Inteligente - Production Docker Compose (Coolify)
# ===================================================================
# This compose file is optimized for deployment on Coolify.
# Features:
# - Production-optimized images (no dev dependencies)
# - Non-root users for security
# - Health checks for all services
# - Proper restart policies
# - Resource limits
# ===================================================================

services:
  # ==========================================================================
  # PostgreSQL 16 - Primary Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cacaotrace-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=es_CO"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Ports not exposed in production - internal only
    networks:
      - cacaotrace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Redis 7 - Channels Layer
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: cacaotrace-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - cacaotrace-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Mosquitto 2.x - MQTT Broker (Production config)
  # ==========================================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cacaotrace-mosquitto
    restart: always
    ports:
      - "1883:1883"   # Plain MQTT - restrict to LAN in production
      - "8883:8883"   # TLS MQTT
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - cacaotrace-net
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Backend - Django Application (Production)
  # ==========================================================================
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/cacaotrace-backend:latest
    container_name: cacaotrace-backend
    restart: always
    user: "appuser:appuser"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    expose:
      - "8000"
    networks:
      - cacaotrace-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL}
      - MQTT_BROKER_USERNAME=${MQTT_BROKER_USERNAME}
      - MQTT_BROKER_PASSWORD=${MQTT_BROKER_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - REDIS_URL=${REDIS_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  # ==========================================================================
  # Frontend - React Application (Production Nginx)
  # ==========================================================================
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/cacaotrace-frontend:latest
    container_name: cacaotrace-frontend
    restart: always
    expose:
      - "80"
    networks:
      - cacaotrace-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # ==========================================================================
  # MCP Server - FastMCP Server (Production)
  # ==========================================================================
  mcp:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/cacaotrace-mcp:latest
    container_name: cacaotrace-mcp
    restart: always
    user: "mcpuser:mcpuser"
    expose:
      - "8001"
    networks:
      - cacaotrace-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - MCP_SERVER_PORT=8001
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL}
      - MQTT_BROKER_USERNAME=${MQTT_BROKER_USERNAME}
      - MQTT_BROKER_PASSWORD=${MQTT_BROKER_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ==========================================================================
  # Simulator - MQTT Data Simulator (Optional - disabled by default)
  # ==========================================================================
  simulator:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/cacaotrace-sim:latest
    container_name: cacaotrace-simulator
    restart: "no"
    profiles:
      - demo  # Enable with: docker compose --profile demo up
    networks:
      - cacaotrace-net
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_BROKER_URL=${MQTT_BROKER_URL}
      - MQTT_BROKER_USERNAME=${MQTT_BROKER_USERNAME}
      - MQTT_BROKER_PASSWORD=${MQTT_BROKER_PASSWORD}
      - SIM_TENANT_ID=${SIM_TENANT_ID}
      - SIM_SPEED_MULTIPLIER=${SIM_SPEED_MULTIPLIER:-1}
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ===================================================================
# Networks
# ===================================================================
networks:
  cacaotrace-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ===================================================================
# Volumes
# ===================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_static:
    driver: local
  backend_media:
    driver: local