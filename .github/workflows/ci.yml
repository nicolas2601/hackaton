name: CI - Continuous Integration

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  UV_SYSTEM_PYTHON: 1
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ===========================================================================
  # Lint Python - Backend, MCP Server, Simulator
  # ===========================================================================
  lint-python:
    name: Lint Python (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: backend
            python-version: "3.12"
          - path: mcp-server
            python-version: "3.12"
          - path: simulator
            python-version: "3.12"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Get changed files in ${{ matrix.path }}
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          paths: |
            ${{ matrix.path }}/**

      - name: Run linting only if files changed
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: ${{ matrix.path }}
        run: |
          uv sync --frozen --no-install-project
          uv run ruff check .
          uv run ruff format --check .

      - name: Run type checking
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: ${{ matrix.path }}
        run: |
          uv run mypy src/ --ignore-missing-imports || true

  # ===========================================================================
  # Lint JavaScript/TypeScript - Frontend
  # ===========================================================================
  lint-js:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Get changed frontend files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          paths: |
            frontend/**

      - name: Install dependencies
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run lint
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: frontend
        run: pnpm run lint

      - name: Run type checking
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: frontend
        run: pnpm run typecheck || true

  # ===========================================================================
  # Test Backend
  # ===========================================================================
  test-backend:
    name: Test Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_manufactura
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --no-install-project

      - name: Get changed backend files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          paths: |
            backend/**

      - name: Run migrations
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_manufactura
        run: |
          uv run python manage.py migrate --settings=config.settings

      - name: Run tests
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_manufactura
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          uv run pytest --tb=short -v

      - name: Upload coverage
        if: steps.changed.outputs.any_changed == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend
          fail_ci_if_error: false

  # ===========================================================================
  # Test Frontend
  # ===========================================================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Get changed frontend files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          paths: |
            frontend/**

      - name: Install dependencies
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: frontend
        run: pnpm run test:unit --coverage

      - name: Upload coverage
        if: steps.changed.outputs.any_changed == 'true'
        uses: codecov/codecov-action@v4
        with:
          flags: frontend
          name: frontend
          fail_ci_if_error: false

  # ===========================================================================
  # Build Docker Images (verify builds work)
  # ===========================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-python, lint-js, test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          target: production
          push: false
          tags: |
            ghcr.io/${{ github.actor }}/manufactura-backend:test
            ghcr.io/${{ github.actor }}/manufactura-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          target: production
          push: false
          tags: |
            ghcr.io/${{ github.actor }}/manufactura-frontend:test
            ghcr.io/${{ github.actor }}/manufactura-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MCP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.mcp
          target: production
          push: false
          tags: |
            ghcr.io/${{ github.actor }}/manufactura-mcp:test
            ghcr.io/${{ github.actor }}/manufactura-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build simulator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sim
          target: production
          push: false
          tags: |
            ghcr.io/${{ github.actor }}/manufactura-sim:test
            ghcr.io/${{ github.actor }}/manufactura-sim:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke tests
        run: |
          echo "Verifying Docker images were built..."
          docker images | grep -E "manufactura-(backend|frontend|mcp|sim)" || exit 1
          echo "All images built successfully!"

  # ===========================================================================
  # Build Summary
  # ===========================================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint-python, lint-js, test-backend, test-frontend, build-docker]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint Python | ${{ needs.lint-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint JS | ${{ needs.lint-js.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Backend | ${{ needs.test-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Frontend | ${{ needs.test-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Docker | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY