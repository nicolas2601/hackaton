name: CD - Continuous Deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (for hotfixes)'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.actor }}/manufactura

jobs:
  # ===========================================================================
  # Deploy to Production
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # Build and Push Backend
      # =========================================================================
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # =========================================================================
      # Build and Push Frontend
      # =========================================================================
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # =========================================================================
      # Build and Push MCP Server
      # =========================================================================
      - name: Build and Push MCP Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.mcp
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-mcp:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # =========================================================================
      # Build and Push Simulator
      # =========================================================================
      - name: Build and Push Simulator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sim
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-sim:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-sim:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # =========================================================================
      # Notify Coolify
      # =========================================================================
      - name: Notify Coolify
        if: vars.COOLIFY_WEBHOOK_URL != ''
        run: |
          curl -X POST "${{ vars.COOLIFY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "event": "deploy",
              "service": "manufactura",
              "images": {
                "backend": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-backend:${{ github.sha }}",
                "frontend": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:${{ github.sha }}",
                "mcp": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-mcp:${{ github.sha }}",
                "sim": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-sim:${{ github.sha }}"
              },
              "commit": "${{ github.sha }}",
              "actor": "${{ github.actor }}"
            }'

      # =========================================================================
      # Create Deployment Summary
      # =========================================================================
      - name: Create Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ env.IMAGE_NAME_PREFIX }}-backend\` | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ env.IMAGE_NAME_PREFIX }}-frontend\` | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MCP | \`${{ env.IMAGE_NAME_PREFIX }}-mcp\` | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Simulator | \`${{ env.IMAGE_NAME_PREFIX }}-sim\` | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Create GitHub Release (on main push with tag-like commit message)
  # ===========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: deploy
    if: contains(github.event.head_commit.message, 'release:') || contains(github.event.head_commit.message, 'Release:')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            *.sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}